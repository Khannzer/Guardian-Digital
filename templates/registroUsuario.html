<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrapValidator.css') }}">

    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrapValidator.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styleRegistro.css') }}">

    <style>
        /* ═══════════════════════════════════════════════
           SELECTOR DE ENTORNO — adaptado al tema oscuro
        ═══════════════════════════════════════════════ */

        .entorno-titulo {
            font-weight: 600;
            color: #d1d1d1;
            margin-bottom: 4px;
            font-size: 15px;
        }
        .entorno-sub {
            color: #777;
            font-size: 12px;
            margin-bottom: 14px;
        }

        /* Grid de tarjetas de tema */
        .tema-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        /* Radio oculto */
        .tema-radio { display: none; }

        /* Tarjeta visible */
        .tema-card {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.08);
            background: #1f1f1f;
            cursor: pointer;
            transition: all 0.25s ease;
            display: block;
            position: relative;
        }
        .tema-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        /* Seleccionado */
        .tema-radio:checked + .tema-card {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77,163,255,0.2), 0 8px 20px rgba(0,0,0,0.4);
        }
        /* Checkmark cuando está seleccionado */
        .tema-radio:checked + .tema-card::after {
            content: '✓';
            position: absolute; top: 6px; right: 7px;
            font-size: 0.58rem; font-weight: 900; color: #fff;
            background: #4da3ff;
            width: 15px; height: 15px; border-radius: 50%;
            line-height: 15px; text-align: center; display: block;
        }

        /* Franja de color degradada */
        .tema-swatch {
            height: 48px; width: 100%;
        }
        .sw-brisa_mar        { background: linear-gradient(135deg, #1D6FD1, #5BA4F5); }
        .sw-lavanda_suave    { background: linear-gradient(135deg, #7C3AED, #A78BFA); }
        .sw-bosque_sereno    { background: linear-gradient(135deg, #1B7A3E, #4BAF6C); }
        .sw-atardecer_calido { background: linear-gradient(135deg, #D05A00, #F9883E); }
        .sw-rosa_amanecer    { background: linear-gradient(135deg, #C2185B, #F06292); }
        .sw-noche_estrellada { background: linear-gradient(135deg, #1A2140, #7B9CFF); }

        /* Texto dentro de la card */
        .tema-info {
            padding: 7px 8px;
            background: #161616;
        }
        .tema-nombre {
            font-size: 0.65rem;
            font-weight: 600;
            color: #d1d1d1;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tema-mood {
            font-size: 0.58rem;
            color: #555;
            display: block;
            margin-top: 1px;
        }

        /* Caja de psicología del color */
        .psych-box {
            background: rgba(77,163,255,0.06);
            border: 1px solid rgba(77,163,255,0.15);
            border-left: 3px solid #4da3ff;
            border-radius: 10px;
            padding: 10px 13px;
            font-size: 0.78rem;
            line-height: 1.55;
            color: #888;
            transition: opacity 0.18s ease;
            min-height: 46px;
        }
        .psych-box strong { color: #4da3ff; }

        /* Responsive: 3 columnas en mobile */
        @media (max-width: 600px) {
            .tema-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

<body>

    <!-- Modal -->
    <div class="modal fade" id="modalMensaje" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" id="modalHeader">
                    <h5 class="modal-title" id="modalTitulo">Mensaje</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body" id="modalBody">Mensaje aquí</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>


    <div class="registro-panel">

        <h3 class="text-center titulo-registro">Crear Cuenta</h3>
        <p class="text-center subtitulo-registro">Completa tus datos para continuar</p>

        <form id="formRegistro" action="/registrar" method="POST">

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Nombre o Usuario</label>
                        <input type="text" name="txtNombre" class="form-control input-moderno" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Apellidos</label>
                        <input type="text" name="txtApellidos" class="form-control input-moderno" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-5">
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" name="txtCorreo" class="form-control input-moderno" placeholder="example@gmail.com" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="txtContrasenia" class="form-control input-moderno" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="text" name="txtEdad" class="form-control input-moderno" min="1" max="100" required>
                    </div>
                </div>
            </div>

            <hr class="mt-2 mb-4">

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>¿Cuáles son tus gustos?</label>
                        <input type="text" name="txtgustos" class="form-control input-moderno" placeholder="Ej: videojuegos, leer, música" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>¿Tu mascota favorita es?</label>
                        <input type="text" name="txtmascota" class="form-control input-moderno" placeholder="Ej: Perro, Gato" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Tono de lenguaje IA</label>
                        <select name="txtlenguaje" class="form-control input-moderno" required>
                            <option value="">Selecciona...</option>
                            <option value="Empático, cálido y comprensivo">Empático y cálido</option>
                            <option value="Directo, práctico y resolutivo">Directo y práctico</option>
                            <option value="Motivador, enérgico y positivo">Motivador y positivo</option>
                            <option value="Sereno, calmado y reflexivo">Sereno y calmado</option>
                            <option value="Amigable, informal y cercano">Amigable con emogis</option>
                        </select>
                    </div>
                </div>
            </div>

            <hr class="mt-2 mb-4">

            <!-- ═══════════════════════════════════════════════
                 SELECTOR DE ENTORNO DE CALMA ← NUEVO
            ═══════════════════════════════════════════════ -->
            <div class="row">
                <div class="col-md-12">
                    <p class="entorno-titulo">🎨 Elige el color de tu Espacio Seguro</p>
                    <p class="entorno-sub">Define la atmósfera visual de tus sesiones. Podrás cambiarlo cuando quieras desde el chat.</p>

                    <div class="tema-grid">

                        <div>
                            <input type="radio" name="txtTemaColor" value="brisa_mar" class="tema-radio" id="tema1" onchange="verPsych(this)" required>
                            <label class="tema-card" for="tema1">
                                <div class="tema-swatch sw-brisa_mar"></div>
                                <div class="tema-info">
                                    <span class="tema-nombre">🌊 Brisa de Mar</span>
                                    <span class="tema-mood">Confianza · Calma</span>
                                </div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" name="txtTemaColor" value="lavanda_suave" class="tema-radio" id="tema2" onchange="verPsych(this)">
                            <label class="tema-card" for="tema2">
                                <div class="tema-swatch sw-lavanda_suave"></div>
                                <div class="tema-info">
                                    <span class="tema-nombre">🌸 Lavanda</span>
                                    <span class="tema-mood">Creatividad · Calma</span>
                                </div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" name="txtTemaColor" value="bosque_sereno" class="tema-radio" id="tema3" onchange="verPsych(this)">
                            <label class="tema-card" for="tema3">
                                <div class="tema-swatch sw-bosque_sereno"></div>
                                <div class="tema-info">
                                    <span class="tema-nombre">🌿 Bosque</span>
                                    <span class="tema-mood">Equilibrio · Natura</span>
                                </div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" name="txtTemaColor" value="atardecer_calido" class="tema-radio" id="tema4" onchange="verPsych(this)">
                            <label class="tema-card" for="tema4">
                                <div class="tema-swatch sw-atardecer_calido"></div>
                                <div class="tema-info">
                                    <span class="tema-nombre">🌅 Atardecer</span>
                                    <span class="tema-mood">Energía · Calidez</span>
                                </div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" name="txtTemaColor" value="rosa_amanecer" class="tema-radio" id="tema5" onchange="verPsych(this)">
                            <label class="tema-card" for="tema5">
                                <div class="tema-swatch sw-rosa_amanecer"></div>
                                <div class="tema-info">
                                    <span class="tema-nombre">🌹 Rosa</span>
                                    <span class="tema-mood">Compasión · Ternura</span>
                                </div>
                            </label>
                        </div>

                        <div>
                            <input type="radio" name="txtTemaColor" value="noche_estrellada" class="tema-radio" id="tema6" onchange="verPsych(this)">
                            <label class="tema-card" for="tema6">
                                <div class="tema-swatch sw-noche_estrellada"></div>
                                <div class="tema-info">
                                    <span class="tema-nombre">🌌 Noche</span>
                                    <span class="tema-mood">Descanso · Serenidad</span>
                                </div>
                            </label>
                        </div>

                    </div>

                    <!-- Descripción psicológica del color elegido -->
                    <div class="psych-box" id="psychBox">
                        👆 Selecciona un color para ver su <strong>efecto psicológico</strong> en tu bienestar.
                    </div>

                </div>
            </div>
            <!-- ═══ FIN SELECTOR ═══ -->

            <hr class="mt-4 mb-4">

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Departamento</label>
                        <select name="selectDepartamento" id="departamento" class="form-control input-moderno">
                            <option value="">Seleccione Departamento</option>
                            {% for d in departamentos %}
                            <option value="{{ d.id_departamento }}">{{ d.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Provincia</label>
                        <select name="selectProvincia" id="provincia" class="form-control input-moderno">
                            <option value="">Seleccione Provincia</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Distrito</label>
                        <select name="selectDistrito" id="distrito" class="form-control input-moderno">
                            <option value="">Seleccione Distrito</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-6">
                    <button type="button" class="btn btn-secondary btn-block btn-secundario-moderno"
                        onclick="window.location.href='/inicio'">
                        Ya tengo cuenta
                    </button>
                </div>
                <div class="col-md-6">
                    <button type="submit" class="btn btn-primary btn-block btn-moderno">
                        Crear Cuenta
                    </button>
                </div>
            </div>

        </form>
    </div>

    <script>
        /* ═══════════════════════════════════════════════
           PSICOLOGÍA DEL COLOR
        ═══════════════════════════════════════════════ */
        const PSYCH = {
            brisa_mar:         '<strong>🌊 Brisa de Mar</strong> — El azul transmite <strong>confianza, calma y seguridad</strong>. Ideal para reducir la ansiedad y fomentar la comunicación abierta.',
            lavanda_suave:     '<strong>🌸 Lavanda Suave</strong> — El violeta evoca <strong>creatividad e introspección</strong>. Favorece la reflexión profunda y la conexión emocional.',
            bosque_sereno:     '<strong>🌿 Bosque Sereno</strong> — El verde simboliza <strong>equilibrio y crecimiento</strong>. Reduce el cortisol y transmite renovación y esperanza.',
            atardecer_calido:  '<strong>🌅 Atardecer Cálido</strong> — El naranja aporta <strong>energía y calidez</strong>. Estimula la conversación y el optimismo.',
            rosa_amanecer:     '<strong>🌹 Rosa Amanecer</strong> — El rosa transmite <strong>compasión y ternura</strong>. Crea un ambiente de vulnerabilidad segura.',
            noche_estrellada:  '<strong>🌌 Noche Estrellada</strong> — El azul oscuro invita a la <strong>introspección y el descanso profundo</strong>. Para procesar emociones en calma.'
        };

        function verPsych(radio) {
            const box = document.getElementById('psychBox');
            box.style.opacity = '0';
            setTimeout(function () {
                box.innerHTML = PSYCH[radio.value] || '';
                box.style.transition = 'opacity 0.2s ease';
                box.style.opacity = '1';
            }, 140);
        }

        /* ═══════════════════════════════════════════════
           BOOTSTRAP VALIDATOR + DEPARTAMENTOS
        ═══════════════════════════════════════════════ */
        $(document).ready(function () {
            $('#formRegistro').bootstrapValidator({
                fields: {
                    txtNombre: {
                        validators: {
                            notEmpty: { message: 'El nombre es requerido' },
                            stringLength: { min: 3, max: 30, message: 'Debe tener entre 3 y 30 caracteres' }
                        }
                    },
                    txtApellidos: {
                        validators: { notEmpty: { message: 'Los apellidos son requeridos' } }
                    },
                    txtContrasenia: {
                        validators: { notEmpty: { message: 'La contraseña es requerida' } }
                    },
                    txtCorreo: {
                        validators: {
                            notEmpty: { message: 'El correo es requerido' },
                            emailAddress: { message: 'Ingrese un correo válido' }
                        }
                    },
                    txtEdad: {
                        validators: {
                            notEmpty: { message: 'La edad es requerida' },
                            between: { min: 1, max: 100, message: 'Edad inválida' }
                        }
                    },
                    txtgustos: {
                        validators: { notEmpty: { message: 'Por favor ingrese sus gustos / intereses' } }
                    },
                    txtmascota: {
                        validators: { notEmpty: { message: 'Ingrese su mascota / animal favorito' } }
                    },
                    txtlenguaje: {
                        validators: { notEmpty: { message: 'Por favor, selecciona un tono de lenguaje' } }
                    },
                    txtTemaColor: {
                        validators: { notEmpty: { message: 'Por favor, elige un color para tu espacio seguro' } }
                    },
                    selectDepartamento: {
                        validators: { notEmpty: { message: 'Seleccione un departamento' } }
                    },
                    selectProvincia: {
                        validators: { notEmpty: { message: 'Seleccione una provincia' } }
                    },
                    selectDistrito: {
                        validators: { notEmpty: { message: 'Seleccione un distrito' } }
                    }
                }
            });

            // Departamento → Provincia
            $("#departamento").change(function () {
                let id_departamento = $(this).val();
                $("#provincia").html('<option value="">Cargando...</option>');
                $("#distrito").html('<option value="">Seleccione Distrito</option>');
                if (id_departamento) {
                    $.get("/provincias/" + id_departamento, function (data) {
                        let opciones = '<option value="">Seleccione Provincia</option>';
                        data.forEach(function (prov) {
                            opciones += `<option value="${prov.id_provincia}">${prov.nombre}</option>`;
                        });
                        $("#provincia").html(opciones);
                    });
                }
            });

            // Provincia → Distrito
            $("#provincia").change(function () {
                let id_provincia = $(this).val();
                $("#distrito").html('<option value="">Cargando...</option>');
                if (id_provincia) {
                    $.get("/distritos/" + id_provincia, function (data) {
                        let opciones = '<option value="">Seleccione Distrito</option>';
                        data.forEach(function (dist) {
                            opciones += `<option value="${dist.id_distrito}">${dist.nombre}</option>`;
                        });
                        $("#distrito").html(opciones);
                    });
                }
            });
        });

        // Submit con AJAX
        $('#formRegistro').on('success.form.bv', function (e) {
            e.preventDefault();
            var $form = $(e.target);
            $.ajax({
                url: $form.attr('action'),
                type: "POST",
                data: $form.serialize(),
                success: function (response) {
                    if (response.success) {
                        $("#modalHeader").removeClass().addClass("modal-header bg-success text-white");
                        $("#modalTitulo").text("Registro Exitoso");
                        $("#modalBody").text(response.message);
                        $form[0].reset();
                        $('#modalMensaje').off('hidden.bs.modal').on('hidden.bs.modal', function () {
                            window.location.href = "/inicio";
                        });
                    } else {
                        $("#modalHeader").removeClass().addClass("modal-header bg-danger text-white");
                        $("#modalTitulo").text("Error");
                        $("#modalBody").text(response.message);
                        $form.data('bootstrapValidator').disableSubmitButtons(false);
                    }
                    $("#modalMensaje").modal("show");
                }
            });
        });
    </script>

</body>
</html>
